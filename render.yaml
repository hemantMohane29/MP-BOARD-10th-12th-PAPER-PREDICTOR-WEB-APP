services:
  - type: web
    name: mp-board-paper-predictor
    env: python
    buildCommand: "bash build.sh"
    startCommand: "mkdir -p /tmp/django_sessions && export DB_PATH=/tmp/db.sqlite3 && python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_PATH
        value: "/tmp/db.sqlite3"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
